[package]
name = "dabengine"
version = "0.1.0"
authors = ["Andrew Medworth <github@medworth.org.uk>"]
edition = "2024"

[dependencies]
# Only seeded StdRng is used, so OS randomness (which doesn't build for WebAssembly) isn't needed
rand = { version = "0.10", default-features = false, features = ["std", "std_rng"] }
# Only ASCII patterns are used, so leave out the Unicode tables (which bloat the WebAssembly build)
regex = { version = "1", default-features = false, features = ["std", "perf"] }
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
criterion = "0.8"
serde_json = "1"

# Optimise the tests a little, which makes them several times faster: the generative tests
# compare against a deliberately naive minimax, which is very slow unoptimised. Debug
# assertions and overflow checks stay on.
[profile.test]
opt-level = 1

[[bench]]
name = "benchmarks"
harness = false

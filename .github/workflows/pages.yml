name: Pages

# Publish the site (site/, with the web interface to the engine under /engine) to GitHub Pages

on:
  push:
    branches:
      - master
    paths:
      - 'engine/**'
      - 'web/**'
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions: {}

# Let a deployment in progress finish, but skip queued ones superseded by a later push
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No dependency caches here, since this workflow publishes what it builds
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install WebAssembly toolchain
        run: |
          rustup target add wasm32-unknown-unknown
          # wasm-bindgen-cli must exactly match the wasm-bindgen crate version
          version=$(sed -n '/^name = "wasm-bindgen"$/{n;s/^version = "\(.*\)"$/\1/p}' web/engine-wasm/Cargo.lock)
          cargo install wasm-bindgen-cli --version "$version" --locked
      - name: Build web interface
        working-directory: web/app
        run: |
          npm ci
          npm run build:wasm
          npm run build
      - name: Assemble site
        run: site/assemble.sh _site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # to deploy to GitHub Pages
      id-token: write # to verify the deployment's origin (required by deploy-pages)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

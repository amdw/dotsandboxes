name: Paper

on:
  push:
    branches:
      - master
    paths:
      - '*.tex'
      - '*.py'
      - 'Makefile'
      - 'vc'
      - 'vc-git.awk'
      - '.github/workflows/paper.yml'
  pull_request:
    paths:
      - '*.tex'
      - '*.py'
      - 'Makefile'
      - 'vc'
      - 'vc-git.awk'
      - '.github/workflows/paper.yml'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build paper
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Keep this package list in step with pages.yml
      - name: Install LaTeX and Inkscape
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-fonts-recommended inkscape gawk
      - name: Build paper
        run: make

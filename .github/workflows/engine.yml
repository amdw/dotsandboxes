name: Engine

on:
  push:
    branches:
      - master
    paths:
      - 'engine/**'
      - '.github/workflows/engine.yml'
  pull_request:
    paths:
      - 'engine/**'
      - '.github/workflows/engine.yml'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engine/target
          # Cargo.toml too, since its profiles change what is built (an exact match restores
          # the cache without saving it again, so would keep restoring outdated builds)
          key: ${{ runner.os }}-cargo-${{ hashFiles('engine/Cargo.lock', 'engine/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-
      # Build every target without serde, then run the tests once with it: the feature only
      # adds serialisation (and tests of it), so the other tests behave the same either way
      - name: Build
        run: cargo build --all-targets
      - name: Test
        run: cargo test --features serde
      - name: Test benchmark report script
        run: python3 -m unittest discover -s ci -v

  benchmark:
    # Fail if a pull request makes the fast benchmarks significantly slower, so that the
    # pull request shows a failed check. Don't make this check required: a slowdown can be
    # worth it (such as the cost of a correctness fix), and runner noise could cause a false
    # alarm. Both versions are benchmarked in the same job, on the same runner, to keep
    # noise between runners out of the comparison.
    name: Benchmark against base branch
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Each version builds in its own target directory (sharing one lets Cargo reuse a
      # build of the wrong version), but both store results here, so that the pull
      # request's run can compare against the base's saved baseline
      CRITERION_HOME: ${{ github.workspace }}/criterion
      # Fail if even the lower bound of a benchmark's estimated slowdown exceeds this
      # percentage. (Quick mode takes too few samples for Criterion's own verdict to
      # report anything as significant.)
      THRESHOLD_PERCENT: '10'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engine/target
            base/engine/target
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('engine/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-bench-
      - name: Benchmark base branch
        working-directory: base/engine
        run: cargo bench --bench benchmarks -- --quick fast-evaluations --save-baseline base
      - name: Benchmark pull request
        working-directory: engine
        run: cargo bench --bench benchmarks -- --quick fast-evaluations --baseline-lenient base
      - name: Report regressions
        run: >
          python3 engine/ci/benchmark_report.py "$CRITERION_HOME"
          --threshold-percent "$THRESHOLD_PERCENT" --fail-on-regression
